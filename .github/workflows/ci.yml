name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.FLOWKIT_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: azure/setup-kubectl@v4

      - name: Authenticate GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          printf '%s\n' \
            '@naakwu:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            'always-auth=true' > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

      - name: Build production image
        run: docker build --secret id=npmrc,src="$HOME/.npmrc" -f Dockerfile .
      - name: Validate Compose
        run: |
          docker compose config --quiet
          FLOWKIT_NPMRC_PATH="$HOME/.npmrc" docker compose -f deploy/compose/docker-compose.yml config --quiet
      - name: Render k3s manifests
        run: kubectl kustomize deploy/k8s/overlays/k3s-dev > "$RUNNER_TEMP/flowkit-demo-k3s.yaml"
      - name: Scan deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern='packages/flowkit-''demo|faan-''avsec|public-''web|internal-''web|mini''stack'
          if rg -n -i "$legacy_pattern" Dockerfile docker-compose.yml Tiltfile deploy .github; then
            echo 'Legacy monorepo or tenant-specific deployment path found.' >&2
            exit 1
          fi
          if rg -n '(_authToken=[^$]|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' \
              Dockerfile docker-compose.yml Tiltfile deploy .npmrc.example; then
            echo 'Committed secret material found.' >&2
            exit 1
          fi
          if rg -n -i 'faan|avsec' "$RUNNER_TEMP/flowkit-demo-k3s.yaml"; then
            echo 'Rendered k3s resources are not tenant-neutral.' >&2
            exit 1
          fi

      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium
      - name: Browser proof against disposable stack
        run: CI=true NODE_ENV=test bun run stack:ci
