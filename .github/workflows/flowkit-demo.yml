name: Flowkit Demo

on:
  pull_request:
    paths:
      - "packages/flowkit-*/**"
      - "packages/flowkit-demo/**"
      - "docs/flowkit/**"
      - "docs/superpowers/plans/2026-07-17-flowkit-demo.md"
      - "bun.lock"
  push:
    branches: [main]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/flowkit-core build
      - run: bun run --cwd packages/flowkit-temporal build
      - run: bun run --cwd packages/flowkit-notify build
      - run: bun run --cwd packages/flowkit-tasks build
      - run: bun run --cwd packages/flowkit-auth build
      - run: bun run --cwd packages/flowkit-demo typecheck
      - run: bun run --cwd packages/flowkit-demo build
      - run: bun test packages/flowkit-demo/test

  image:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f packages/flowkit-demo/Dockerfile .
