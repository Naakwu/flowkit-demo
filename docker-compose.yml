name: flowkit-demo

services:
  postgres:
    image: postgres:16.4-alpine
    command: ["postgres", "-c", "cluster_name=flowkit_starter_identity"]
    environment:
      POSTGRES_DB: flowkit_demo
      POSTGRES_USER: flowkit_demo
      POSTGRES_PASSWORD: flowkit_demo
    ports: ["${FLOWKIT_DEMO_POSTGRES_PORT:-5441}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowkit_demo -d flowkit_demo && psql -U flowkit_demo -d flowkit_demo -Atqc \"select current_setting('cluster_name') = 'flowkit_starter_identity'\" | grep -qx t"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: [flowkit_demo_postgres:/var/lib/postgresql/data]

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: flowkit_demo
      POSTGRES_PWD: flowkit_demo
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${FLOWKIT_DEMO_TEMPORAL_PORT:-7233}:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-namespace:
    image: temporalio/admin-tools:1.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      temporal: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'temporal operator namespace describe --namespace flowkit-demo >/dev/null 2>&1 || temporal operator namespace create --namespace flowkit-demo >/dev/null; exec sleep infinity'
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe --namespace flowkit-demo >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["${FLOWKIT_DEMO_MAILPIT_HTTP_PORT:-8025}:8025", "${FLOWKIT_DEMO_MAILPIT_SMTP_PORT:-1025}:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  flowkit_demo_postgres:
