fullnameOverride: temporal

server:
  replicaCount: 1
  config:
    numHistoryShards: 1
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 1
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db-credentials
            secretKey: password
    namespaces:
      create: true
      namespace:
        - name: faan-avsec-odc
          retention: 7d
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db-credentials
            secretKey: password
  frontend:
    replicaCount: 1
  history:
    replicaCount: 1
  matching:
    replicaCount: 1
  worker:
    replicaCount: 1

web:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP

admintools:
  enabled: true

elasticsearch:
  enabled: false
