fullnameOverride: temporal

server:
  replicaCount: 1
  config:
    logLevel: debug,info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 1
      datastores:
        default:
          sql:
            createDatabase: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: flowkit_demo
            password: flowkit_demo
        visibility:
          sql:
            createDatabase: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: flowkit_demo
            password: flowkit_demo
    namespaces:
      create: true
      namespace:
        - name: flowkit-demo
          retention: 7d
    metrics:
      prometheus:
        timerType: histogram
        listenAddress: "0.0.0.0:9090"
  frontend:
    replicaCount: 1
  history:
    replicaCount: 1
  matching:
    replicaCount: 1
  worker:
    replicaCount: 1

web:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP

admintools:
  enabled: true
