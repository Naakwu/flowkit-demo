apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
    - name: http
      port: 3005
      targetPort: http
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: faan-avsec
      imagePullSecrets:
        - name: registry-credentials
      initContainers:
        - name: migration
          image: docker.pigstycoders.com/faan-avsec-dev/migration:dev
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: avsec-runtime
          command: ["sh", "-ec"]
          args:
            - migrate apply --url "$DATABASE_URL" --allow-dirty
      containers:
        - name: backend
          image: docker.pigstycoders.com/faan-avsec-dev/backend:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: avsec-config
            - secretRef:
                name: avsec-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
