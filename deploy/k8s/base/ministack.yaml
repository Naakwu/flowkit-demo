apiVersion: v1
kind: Service
metadata:
  name: ministack
spec:
  ports:
    - name: edge
      port: 4566
      targetPort: edge
  selector:
    app.kubernetes.io/name: ministack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ministack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack
    spec:
      serviceAccountName: faan-avsec
      containers:
        - name: ministack
          image: localstack/localstack:4.7
          env:
            - name: SERVICES
              value: s3,sqs,sns
            - name: DEBUG
              value: "0"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - name: edge
              containerPort: 4566
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 10
