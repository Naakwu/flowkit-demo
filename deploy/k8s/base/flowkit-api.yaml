apiVersion: v1
kind: Service
metadata:
  name: flowkit-api
spec:
  ports:
    - name: http
      port: 3011
      targetPort: http
  selector:
    app.kubernetes.io/name: flowkit-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowkit-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flowkit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowkit-api
        app.kubernetes.io/part-of: flowkit-demo
    spec:
      serviceAccountName: flowkit-demo
      imagePullSecrets:
        - name: flowkit-demo-registry
      containers:
        - name: flowkit-api
          image: docker.pigstycoders.com/flowkit-demo-dev/flowkit-demo
          imagePullPolicy: Always
          command: ["bun", "run", "apps/api/src/main.ts"]
          ports:
            - name: http
              containerPort: 3011
          envFrom:
            - configMapRef:
                name: flowkit-demo-config
            - secretRef:
                name: flowkit-demo-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
