apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: faan-avsec
      containers:
        - name: bootstrap
          image: postgres:16.4
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: TEMPORAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-credentials
                  key: password
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d db_prod; do sleep 2; done
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -v temporal_password="$TEMPORAL_DB_PASSWORD" -h postgres -U "$POSTGRES_USER" -d db_prod <<'SQL'
              DO $$ BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'temporal') THEN
                  CREATE ROLE temporal LOGIN PASSWORD :'temporal_password';
                ELSE
                  ALTER ROLE temporal WITH LOGIN PASSWORD :'temporal_password';
                END IF;
              END $$;
              SELECT 'CREATE DATABASE temporal OWNER temporal' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'temporal')\gexec
              SELECT 'CREATE DATABASE temporal_visibility OWNER temporal' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'temporal_visibility')\gexec
              SQL
