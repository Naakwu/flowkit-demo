apiVersion: batch/v1
kind: Job
metadata:
  name: flowkit-temporal-namespace
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: namespace
          image: temporalio/admin-tools:1.26.2
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: TEMPORAL_CLI_ADDRESS
              value: temporal-frontend:7233
          command: ["/bin/sh", "-c"]
          args:
            - until temporal operator namespace describe --namespace flowkit-demo >/dev/null 2>&1; do temporal operator namespace create --namespace flowkit-demo >/dev/null 2>&1 || true; sleep 2; done