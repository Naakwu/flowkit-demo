apiVersion: batch/v1
kind: Job
metadata:
  name: flowkit-seed
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flowkit-demo
      imagePullSecrets:
        - name: flowkit-demo-registry
      containers:
        - name: flowkit-seed
          image: docker.pigstycoders.com/flowkit-demo-dev/flowkit-demo
          imagePullPolicy: Always
          command: ["bun", "run", "db:seed"]
          envFrom:
            - configMapRef:
                name: flowkit-demo-config
            - secretRef:
                name: flowkit-demo-runtime