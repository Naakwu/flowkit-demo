apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowkit-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowkit-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowkit-worker
        app.kubernetes.io/part-of: flowkit-demo
    spec:
      serviceAccountName: flowkit-demo
      imagePullSecrets:
        - name: flowkit-demo-registry
      containers:
        - name: flowkit-worker
          image: docker.pigstycoders.com/flowkit-demo-dev/flowkit-demo
          imagePullPolicy: Always
          command: ["bun", "run", "apps/worker/src/main.ts"]
          envFrom:
            - configMapRef:
                name: flowkit-demo-config
            - secretRef:
                name: flowkit-demo-runtime
