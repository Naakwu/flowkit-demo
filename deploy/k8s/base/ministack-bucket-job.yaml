apiVersion: batch/v1
kind: Job
metadata:
  name: ministack-bucket
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack-bucket
    spec:
      restartPolicy: OnFailure
      serviceAccountName: faan-avsec
      containers:
        - name: bucket
          image: amazon/aws-cli:2.27.52
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ["sh", "-ec"]
          args:
            - |
              until aws --endpoint-url http://ministack:4566 s3api list-buckets >/dev/null 2>&1; do sleep 2; done
              aws --endpoint-url http://ministack:4566 s3api create-bucket --bucket my-bucket || true
